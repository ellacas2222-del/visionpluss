name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew build
        continue-on-error: true
      - name: API info
        run: |
          CP=$(find ~/.gradle ~/.m2 -name '*.jar' 2>/dev/null | tr '\n' ':')
          J() { javap -cp "$CP" "$@" 2>&1; }
          echo "=== CLASES GUI ==="
          for j in $(find ~/.gradle -name '*.jar'); do unzip -l "$j" 2>/dev/null | grep -E "GuiGraphics|HudElement|HudLayer|DeltaTracker|PlayerFace|PlayerSkin|SkinTexture|RemotePlayer|KeyboardInput|ClientInput|/Input\.class" | awk '{print $4}'; done | sort -u
          echo "=== Screen ==="; J net.minecraft.client.gui.screens.Screen | grep -iE "render|extract|background"
          echo "=== Minecraft camera ==="; J net.minecraft.client.Minecraft | grep -iE "cameraentity|getWindow|window|options"
          echo "=== Camera ==="; J net.minecraft.client.Camera | grep -iE "setup|setPosition|setRotation|rotation|entity"
          echo "=== Window ==="; J com.mojang.blaze3d.platform.Window | grep -iE "handle|width|height|scaled"
          echo "=== InputConstants ==="; J com.mojang.blaze3d.platform.InputConstants | grep -iE "isKeyDown"
          echo "=== Options keys ==="; J net.minecraft.client.Options | grep -iE "keyUp|keyDown|keyLeft|keyRight|keyJump|keyShift|keySprint"
          echo "=== ClientLevel ==="; J net.minecraft.client.multiplayer.ClientLevel | grep -iE "addEntity|addPlayer|removeEntity|addFreshEntity"
          echo "=== RemotePlayer ==="; J net.minecraft.client.player.RemotePlayer
          echo "=== Entity pos ==="; J net.minecraft.world.entity.Entity | grep -iE " setPos\(| setRot\(|noPhysics|setYRot|setXRot|setOldPosAndRot|snapTo|moveTo"
          echo "=== HUD ==="; for c in $(find ~/.gradle -name '*.jar'); do unzip -l "$c" 2>/dev/null | grep -E "HudElementRegistry|HudRenderCallback" | awk '{print $4}'; done | sort -u
      - uses: actions/upload-artifact@v4
        with:
          name: visionplus-jar
          path: build/libs/
